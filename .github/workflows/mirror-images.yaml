name: Mirror deployment images

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y skopeo

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | skopeo login ghcr.io -u github-actions --password-stdin
          mirror() { skopeo copy "docker://$1" "docker://ghcr.io/$OWNER/$2"; }
          mirror cozedev/coze-loop:1.5.1 coze-dep-loop:1.5.1
          mirror cozedev/coze-loop-python-faas:1.0.0 coze-dep-loop-python-faas:1.0.0
          mirror redis:8.2.0 coze-dep-redis:8.2.0
          mirror mysql:9.4.0 coze-dep-mysql:9.4.0
          mirror clickhouse/clickhouse-server:latest coze-dep-clickhouse:latest
          mirror bitnamilegacy/minio:2025.6.13-debian-12-r0 coze-dep-minio:2025.6.13
          mirror apache/rocketmq:5.3.3 coze-dep-rocketmq:5.3.3
          mirror nginx:1.28.0 coze-dep-nginx:1.28.0
          mirror denoland/deno:1.45.5 coze-dep-deno:1.45.5
          mirror mysql:8.4.5 coze-dep-mysql:8.4.5
          mirror bitnamilegacy/redis:8.0 coze-dep-bitnami-redis:8.0
          mirror bitnamilegacy/elasticsearch:8.18.0 coze-dep-elasticsearch:8.18.0
          mirror bitnamilegacy/etcd:3.5 coze-dep-etcd:3.5
          mirror milvusdb/milvus:v2.5.10 coze-dep-milvus:2.5.10
          mirror nsqio/nsq:v1.2.1 coze-dep-nsq:1.2.1
          mirror cozedev/coze-studio-server:latest coze-dep-studio-server:latest
          mirror cozedev/coze-studio-web:latest coze-dep-studio-web:latest

  prefetch:
    needs: mirror
    runs-on: [self-hosted, coze-loop-deploy]
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u github-actions --password-stdin
          cd /opt/coze/coze-loop
          docker compose --env-file .env --env-file .deploy.env -f docker-compose.yml -f docker-compose.deploy.yml --profile '*' pull
          cd /opt/coze/coze-studio/docker
          docker compose --env-file .env --env-file .deploy.env -f docker-compose.yml -f docker-compose.deploy.yml pull
          docker logout ghcr.io
